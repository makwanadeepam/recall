name: Release

# Builds native installers for macOS, Windows, and Linux and publishes them to a
# GitHub Release. Triggered by pushing a version tag (e.g. v0.1.0), or manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS universal binary (runs on both Apple Silicon and Intel).
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          # Linux: .deb, .rpm and .AppImage.
          - platform: ubuntu-22.04
            args: ""
          # Windows: .msi (WiX) and .exe (NSIS).
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Recall ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}"
          releaseBody: |
            Recall desktop installers.

            - **macOS**: download the `.dmg` (universal — Apple Silicon & Intel).
            - **Windows**: download the `.msi` or the `.exe` (NSIS) installer.
            - **Linux**: download the `.AppImage`, `.deb`, or `.rpm`.

            These builds are not code-signed, so your OS may show a security
            prompt on first launch (on macOS: right-click → Open; on Windows:
            "More info" → "Run anyway").
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
